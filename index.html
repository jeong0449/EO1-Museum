<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>EO1 Museum</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}


/*
 * Full artwork layer.
 */
#photo {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    opacity: 0;
}


/*
 * Two detail layers.
 *
 * The same pan_####.jpg is loaded into both.
 * They alternate so that Left -> Center -> Right
 * can cross-dissolve directly.
 *
 * Detail images are never enlarged beyond
 * their actual pixel dimensions.
 */
.detail {
    position: absolute;

    left: 0;
    top: 0;

    width: auto;
    height: auto;

    max-width: none;
    max-height: 100%;

    background: #000;

    opacity: 0;
}


/*
 * Pre-rendered pan video.
 *
 * The MP4 itself is already rendered at
 * 1080 x 1920 with a black background.
 */
#panVideo {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    opacity: 0;
}

</style>
</head>


<body>

<div id="stage">

    <img
        id="photo"
        alt=""
    >

    <img
        id="detailA"
        class="detail"
        alt=""
    >

    <img
        id="detailB"
        class="detail"
        alt=""
    >

    <video
        id="panVideo"
        muted
        playsinline
        preload="auto"
    ></video>

</div>


<script src="images.js?v=6"></script>


<script>

(function () {

    /*
     * ============================================================
     * Timing
     * ============================================================
     */

    /*
     * Normal portrait / non-wide artwork.
     */
    var NORMAL_HOLD = 30000;


    /*
     * Wide artwork:
     *
     * Full artwork first.
     */
    var FULL_HOLD = 15000;


    /*
     * Cross-dissolve duration.
     */
    var DISSOLVE_TIME = 1500;


    /*
     * Hold time for each enlarged JPG view:
     *
     * Left
     * Center
     * Right
     */
    var DETAIL_HOLD = 6000;


    /*
     * After Right, or after MP4,
     * return to the complete artwork
     * and hold it briefly.
     */
    var FINAL_FULL_HOLD = 5000;


    /*
     * ============================================================
     * State
     * ============================================================
     */

    var order = [];

    var pos = 0;

    var timerId = null;


    var photo =
        document.getElementById(
            "photo"
        );

    var detailA =
        document.getElementById(
            "detailA"
        );

    var detailB =
        document.getElementById(
            "detailB"
        );

    var panVideo =
        document.getElementById(
            "panVideo"
        );


    /*
     * The current wide artwork.
     *
     * Used when MP4 probing fails and
     * we need to fall back to JPG details.
     */
    var currentItem = null;


    /*
     * ============================================================
     * Timer helper
     * ============================================================
     */

    function schedule(
        fn,
        delay
    ) {

        if (timerId !== null) {

            clearTimeout(
                timerId
            );
        }

        timerId =
            setTimeout(
                fn,
                delay
            );
    }


    /*
     * ============================================================
     * Shuffle
     * ============================================================
     */

    function shuffle() {

        order =
            images.slice();

        for (
            var i = order.length - 1;
            i > 0;
            i--
        ) {

            var j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );

            var temp =
                order[i];

            order[i] =
                order[j];

            order[j] =
                temp;
        }

        pos = 0;
    }


    /*
     * ============================================================
     * Reset layers
     * ============================================================
     */

    function resetLayers() {

        if (timerId !== null) {

            clearTimeout(
                timerId
            );

            timerId = null;
        }


        photo.style.transition =
            "none";

        detailA.style.transition =
            "none";

        detailB.style.transition =
            "none";

        panVideo.style.transition =
            "none";


        photo.style.opacity =
            "0";

        detailA.style.opacity =
            "0";

        detailB.style.opacity =
            "0";

        panVideo.style.opacity =
            "0";


        detailA.style.left =
            "0px";

        detailB.style.left =
            "0px";


        detailA.style.top =
            "0px";

        detailB.style.top =
            "0px";


        /*
         * Stop any video left over from
         * the previous artwork.
         */
        try {

            panVideo.pause();

        } catch (e) {
        }


        panVideo.oncanplay =
            null;

        panVideo.onloadeddata =
            null;

        panVideo.onerror =
            null;

        panVideo.onended =
            null;


        panVideo.removeAttribute(
            "src"
        );

        try {

            panVideo.load();

        } catch (e) {
        }
    }


    /*
     * ============================================================
     * Convert pan JPG path to MP4 path
     * ============================================================
     *
     * Example:
     *
     * display/pan_0017.jpg
     *
     * becomes:
     *
     * display/pan_0017.mp4
     */

    function getPanVideoPath(
        panPath
    ) {

        if (!panPath) {

            return null;
        }


        return panPath.replace(
            /\.[^.\/]+$/,
            ".mp4"
        );
    }


    /*
     * ============================================================
     * Next artwork
     * ============================================================
     */

    function next() {

        if (
            typeof images === "undefined" ||
            !images ||
            images.length === 0
        ) {

            return;
        }


        if (
            pos >= order.length
        ) {

            shuffle();
        }


        var item =
            order[pos];

        pos++;


        currentItem =
            item;


        /*
         * Prepare all layers.
         *
         * Keep everything invisible while
         * the next full artwork is loading.
         */
        resetLayers();


        var cacheBust =
            "?v=" +
            new Date().getTime();


        /*
         * --------------------------------------------------------
         * IMPORTANT FOR OLD ANDROID WEBVIEW
         * --------------------------------------------------------
         *
         * Do not make the photo layer visible immediately
         * after changing photo.src.
         *
         * Old Android WebView may briefly repaint the
         * previous bitmap before the new image has finished
         * decoding.
         *
         * The new artwork becomes visible only after
         * its onload event fires.
         */

        photo.onload =
            function () {

                /*
                 * Remove this handler immediately.
                 */
                photo.onload =
                    null;


                /*
                 * Make sure the new bitmap has been
                 * committed while the layer is still
                 * invisible.
                 */
                photo.style.transition =
                    "none";

                photo.style.opacity =
                    "0";


                photo.offsetWidth;


                /*
                 * Now show the newly loaded artwork.
                 */
                photo.style.opacity =
                    "1";


                /*
                 * Wide artwork.
                 */
                if (item.pan) {

                    playWideArtwork(
                        item
                    );

                } else {

                    /*
                     * Normal artwork.
                     */
                    schedule(
                        function () {

                            fadeNormalToNext();

                        },
                        NORMAL_HOLD
                    );
                }
            };


        /*
         * Wide artwork:
         *
         * Preload the same detail image into
         * both detail layers.
         *
         * Even when an MP4 exists, the JPG is
         * retained as a fallback.
         */
        if (item.pan) {

            detailA.src =
                item.pan +
                cacheBust;

            detailB.src =
                item.pan +
                cacheBust;

        } else {

            detailA.removeAttribute(
                "src"
            );

            detailB.removeAttribute(
                "src"
            );
        }


        /*
         * Set the new full-artwork source LAST.
         *
         * The photo layer remains invisible until
         * photo.onload above confirms that the new
         * bitmap is ready.
         */
        photo.src =
            item.display +
            cacheBust;
    }


    /*
     * ============================================================
     * Normal artwork -> next artwork
     * ============================================================
     */

    function fadeNormalToNext() {

        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        photo.style.opacity =
            "0";


        schedule(
            next,
            DISSOLVE_TIME
        );
    }


    /*
     * ============================================================
     * Wide artwork
     * ============================================================
     *
     * Full artwork is shown first.
     *
     * Then:
     *
     *     MP4 exists
     *
     *         Full
     *           ->
     *         MP4
     *           ->
     *         Full
     *           ->
     *         Next
     *
     *     MP4 unavailable
     *
     *         Full
     *           ->
     *         Left
     *           ->
     *         Center
     *           ->
     *         Right
     *           ->
     *         Full
     *           ->
     *         Next
     */

    function playWideArtwork(
        item
    ) {

        schedule(
            function () {

                tryPanVideo(
                    item
                );

            },
            FULL_HOLD
        );
    }


    /*
     * ============================================================
     * Try MP4
     * ============================================================
     *
     * No manifest change is required.
     *
     * The video path is derived from item.pan.
     *
     * If the MP4 cannot be loaded,
     * the existing JPG detail sequence is used.
     */

    function tryPanVideo(
        item
    ) {

        var videoPath =
            getPanVideoPath(
                item.pan
            );


        if (!videoPath) {

            startDetailSequence();

            return;
        }


        var settled =
            false;


        /*
         * --------------------------------------------------------
         * MP4 success
         * --------------------------------------------------------
         */

        function videoReady() {

            if (settled) {

                return;
            }

            settled = true;


            panVideo.oncanplay =
                null;

            panVideo.onloadeddata =
                null;

            panVideo.onerror =
                null;


            startPanVideo();
        }


        /*
         * --------------------------------------------------------
         * MP4 unavailable
         * --------------------------------------------------------
         */

        function videoFailed() {

            if (settled) {

                return;
            }

            settled = true;


            panVideo.oncanplay =
                null;

            panVideo.onloadeddata =
                null;

            panVideo.onerror =
                null;


            try {

                panVideo.pause();

            } catch (e) {
            }


            panVideo.removeAttribute(
                "src"
            );


            /*
             * Use the existing static detail
             * presentation instead.
             */
            startDetailSequence();
        }


        panVideo.oncanplay =
            videoReady;

        panVideo.onloadeddata =
            videoReady;

        panVideo.onerror =
            videoFailed;


        /*
         * Do NOT add cache busting here.
         *
         * The MP4 is a static generated asset and
         * allowing browser caching is desirable.
         */
        panVideo.src =
            videoPath;


        try {

            panVideo.load();

        } catch (e) {

            videoFailed();
        }
    }


    /*
     * ============================================================
     * Start MP4 sequence
     * ============================================================
     */

    function startPanVideo() {

        /*
         * Video starts invisibly.
         */
        panVideo.style.transition =
            "none";

        panVideo.style.opacity =
            "0";


        try {

            panVideo.currentTime =
                0;

        } catch (e) {
        }


        panVideo.offsetWidth;


        /*
         * FULL -> VIDEO
         */
        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        panVideo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";


        photo.style.opacity =
            "0";

        panVideo.style.opacity =
            "1";


        /*
         * When the MP4 reaches its end,
         * return to the full artwork.
         */
        panVideo.onended =
            function () {

                panVideo.onended =
                    null;

                dissolveVideoToFull();
            };


        /*
         * Start playback.
         */
        var playResult;

        try {

            playResult =
                panVideo.play();

        } catch (e) {

            fallbackFromVideo();

            return;
        }


        /*
         * Modern browsers return a Promise.
         *
         * Old Android WebView may not.
         */
        if (
            playResult &&
            typeof playResult.catch === "function"
        ) {

            playResult.catch(
                function () {

                    fallbackFromVideo();
                }
            );
        }
    }


    /*
     * ============================================================
     * Video playback failure fallback
     * ============================================================
     */

    function fallbackFromVideo() {

        try {

            panVideo.pause();

        } catch (e) {
        }


        panVideo.onended =
            null;


        panVideo.style.transition =
            "none";

        panVideo.style.opacity =
            "0";


        /*
         * Restore the full artwork before
         * entering the JPG detail sequence.
         */
        photo.style.transition =
            "none";

        photo.style.opacity =
            "1";


        photo.offsetWidth;


        startDetailSequence();
    }


    /*
     * ============================================================
     * VIDEO -> FULL
     * ============================================================
     */

    function dissolveVideoToFull() {

        /*
         * Full artwork has remained loaded
         * behind the video.
         */
        photo.style.transition =
            "none";

        photo.style.opacity =
            "0";


        photo.offsetWidth;


        panVideo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";


        panVideo.style.opacity =
            "0";

        photo.style.opacity =
            "1";


        /*
         * Hold the complete artwork again.
         */
        schedule(
            function () {

                finishWideArtwork();

            },
            DISSOLVE_TIME +
            FINAL_FULL_HOLD
        );
    }


    /*
     * ============================================================
     * JPG Detail sequence
     * ============================================================
     *
     * Full
     *   ->
     * Left
     *   ->
     * Center
     *   ->
     * Right
     *   ->
     * Full
     *   ->
     * Next
     */

    function startDetailSequence() {

        var viewportWidth =
            window.innerWidth;

        var viewportHeight =
            window.innerHeight;


        /*
         * Both detail layers contain
         * the same image and have the
         * same displayed dimensions.
         */
        var imageWidth =
            detailA.offsetWidth;

        var imageHeight =
            detailA.offsetHeight;


        /*
         * --------------------------------------------------------
         * Vertical position
         * --------------------------------------------------------
         *
         * A detail image smaller than the EO1 screen is
         * NOT enlarged.
         *
         * Instead, it is centered vertically once.
         *
         * This top position remains unchanged during
         * Left -> Center -> Right.
         */

        var topPosition =
            Math.max(
                0,
                (viewportHeight - imageHeight) / 2
            );


        detailA.style.top =
            topPosition +
            "px";

        detailB.style.top =
            topPosition +
            "px";


        /*
         * Horizontal travel distance.
         */
        var distance =
            Math.max(
                0,
                imageWidth -
                viewportWidth
            );


        /*
         * Safety fallback.
         */
        if (
            distance <= 0
        ) {

            schedule(
                finishWideArtwork,
                500
            );

            return;
        }


        /*
         * Left / Center / Right positions.
         *
         * Only the horizontal coordinate changes.
         */
        var leftPosition =
            0;

        var centerPosition =
            -(distance / 2);

        var rightPosition =
            -distance;


        /*
         * --------------------------------------------------------
         * FULL -> LEFT
         * --------------------------------------------------------
         */

        detailA.style.transition =
            "none";

        detailA.style.left =
            leftPosition +
            "px";

        detailA.style.opacity =
            "0";


        /*
         * Force layout before starting dissolve.
         */
        detailA.offsetWidth;


        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        detailA.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";


        photo.style.opacity =
            "0";

        detailA.style.opacity =
            "1";


        /*
         * Hold Left.
         */
        schedule(
            function () {

                dissolveLeftToCenter();

            },
            DISSOLVE_TIME +
            DETAIL_HOLD
        );


        /*
         * --------------------------------------------------------
         * LEFT -> CENTER
         * --------------------------------------------------------
         */

        function dissolveLeftToCenter() {

            /*
             * Prepare Center invisibly
             * on detailB.
             */
            detailB.style.transition =
                "none";

            detailB.style.left =
                centerPosition +
                "px";

            detailB.style.opacity =
                "0";


            detailB.offsetWidth;


            /*
             * Cross-dissolve:
             *
             * A = Left
             * B = Center
             */
            detailA.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            detailB.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";


            detailA.style.opacity =
                "0";

            detailB.style.opacity =
                "1";


            /*
             * Hold Center.
             */
            schedule(
                function () {

                    dissolveCenterToRight();

                },
                DISSOLVE_TIME +
                DETAIL_HOLD
            );
        }


        /*
         * --------------------------------------------------------
         * CENTER -> RIGHT
         * --------------------------------------------------------
         */

        function dissolveCenterToRight() {

            /*
             * detailA is now invisible.
             *
             * Reuse it for Right.
             */
            detailA.style.transition =
                "none";

            detailA.style.left =
                rightPosition +
                "px";

            detailA.style.opacity =
                "0";


            detailA.offsetWidth;


            /*
             * Cross-dissolve:
             *
             * B = Center
             * A = Right
             */
            detailB.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            detailA.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";


            detailB.style.opacity =
                "0";

            detailA.style.opacity =
                "1";


            /*
             * Hold Right.
             */
            schedule(
                function () {

                    dissolveRightToFull();

                },
                DISSOLVE_TIME +
                DETAIL_HOLD
            );
        }


        /*
         * --------------------------------------------------------
         * RIGHT -> FULL
         * --------------------------------------------------------
         */

        function dissolveRightToFull() {

            /*
             * Full artwork has remained loaded
             * in the photo layer.
             */
            photo.style.transition =
                "none";

            photo.style.opacity =
                "0";


            photo.offsetWidth;


            /*
             * Cross-dissolve:
             *
             * detailA = Right
             * photo   = Full
             */
            detailA.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            photo.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";


            detailA.style.opacity =
                "0";

            photo.style.opacity =
                "1";


            /*
             * Hold the complete artwork again.
             */
            schedule(
                function () {

                    finishWideArtwork();

                },
                DISSOLVE_TIME +
                FINAL_FULL_HOLD
            );
        }
    }


    /*
     * ============================================================
     * FINAL FULL -> NEXT
     * ============================================================
     *
     * Shared by both:
     *
     *     MP4 sequence
     *     JPG detail sequence
     */

    function finishWideArtwork() {

        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        photo.style.opacity =
            "0";


        schedule(
            next,
            DISSOLVE_TIME
        );
    }


    /*
     * ============================================================
     * Start gallery
     * ============================================================
     */

    if (
        typeof images !== "undefined" &&
        images &&
        images.length > 0
    ) {

        shuffle();

        next();
    }

})();

</script>

</body>
</html>
