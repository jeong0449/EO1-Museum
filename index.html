<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>EO1 Museum</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}


/*
 * Full artwork layer.
 */
#photo {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    opacity: 0;
}


/*
 * Two static detail layers.
 *
 * Used only when a pre-rendered MP4
 * is unavailable.
 */
.detail {
    position: absolute;

    left: 0;
    top: 0;

    width: auto;
    height: auto;

    max-width: none;
    max-height: 100%;

    background: #000;

    opacity: 0;
}


/*
 * Pre-rendered pan video.
 *
 * IMPORTANT:
 *
 * On old Android WebView the video is NOT
 * composited with the image layers.
 *
 * During MP4 playback:
 *
 *     photo/detail layers -> display:none
 *     video               -> display:block
 *
 * This avoids the old WebView video /
 * Surface / BufferQueue compositing problem.
 *
 * The same arrangement also works in
 * normal desktop browsers.
 */
#panVideo {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    display: none;
}

#connectionStatus {
    display: none;
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 9%;
    z-index: 20;
    box-sizing: border-box;
    padding: 18px 22px;
    background: rgba(25, 28, 33, 0.92);
    color: #fff;
    font: 22px sans-serif;
    text-align: center;
    line-height: 1.5;
    border-radius: 6px;
    pointer-events: none;
}

</style>
</head>


<body>

<div id="stage">

    <img
        id="photo"
        alt=""
    >

    <img
        id="detailA"
        class="detail"
        alt=""
    >

    <img
        id="detailB"
        class="detail"
        alt=""
    >

    <div id="connectionStatus" aria-live="polite"></div>

    <video
        id="panVideo"
        muted
        playsinline
        preload="auto"
    ></video>

</div>


<script src="images.js?v=6"></script>


<script>

(function () {

    /*
     * ============================================================
     * Timing
     * ============================================================
     */

    var NORMAL_HOLD = 30000;

    var FULL_HOLD = 15000;

    var DISSOLVE_TIME = 1500;

    var DETAIL_HOLD = 6000;

    var FINAL_FULL_HOLD = 5000;


    /*
     * ============================================================
     * State
     * ============================================================
     */

    var order = [];

    var pos = 0;

    var timerId = null;


    var photo =
        document.getElementById(
            "photo"
        );

    var detailA =
        document.getElementById(
            "detailA"
        );

    var detailB =
        document.getElementById(
            "detailB"
        );

    var panVideo =
        document.getElementById(
            "panVideo"
        );


    /*
     * Connection watchdog (Android 4.4-compatible XMLHttpRequest).
     * Poll every 2 seconds. On a confirmed outage, retry 5 times
     * at 2-second intervals, then ask the native app to switch
     * to Internal Gallery. No server-side changes are needed.
     */
    var connectionStatus = document.getElementById("connectionStatus");
    var failedChecks = 0;
    var connectionLost = false;
    var probeInProgress = false;
    var probeTimer = null;
    var requestTimeoutTimer = null;

    function statusText(message) {
        connectionStatus.textContent = message;
        connectionStatus.style.display = message ? "block" : "none";
    }

    function probeServer() {
        if (probeInProgress) return;
        probeInProgress = true;
        var xhr = new XMLHttpRequest();
        var finished = false;
        function done(ok) {
            if (finished) return;
            finished = true;
            probeInProgress = false;
            clearTimeout(requestTimeoutTimer);
            if (ok) {
                failedChecks = 0;
                if (connectionLost) {
                    statusText("PC Gallery reconnected. Reloading...");
                    window.location.reload();
                }
                return;
            }
            if (!connectionLost) {
                connectionLost = true;
                // Stop the slideshow before its next transition.
                if (timerId !== null) {
                    clearTimeout(timerId);
                    timerId = null;
                }
            }
            failedChecks++;
            if (failedChecks >= 5) {
                statusText("PC Gallery unavailable. Switching to Internal Gallery...");
                clearInterval(probeTimer);
                if (window.EO1 &&
                    typeof window.EO1.networkConnectionFailed === "function") {
                    window.EO1.networkConnectionFailed();
                } else {
                    statusText("PC Gallery unavailable. Select Internal Gallery from the menu.");
                }
            } else {
                statusText("PC Gallery connection lost. Reconnecting... (" +
                    failedChecks + "/5)");
            }
        }
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                // Verify the actual EO1 server identity, not just HTTP 200.
                done(xhr.status === 200 &&
                    /^EO1M-[^\r\n]+[\r\n]+SYNC=[01]/.test(xhr.responseText));
            }
        };
        xhr.onerror = function() { done(false); };
        requestTimeoutTimer = setTimeout(function() {
            try { xhr.abort(); } catch (e) {}
            done(false);
        }, 1500);
        try {
            xhr.open("GET", "eo1-status?watch=" + new Date().getTime(), true);
            xhr.send(null);
        } catch (e) {
            done(false);
        }
    }

    // Initial check and regular connection monitoring.
    probeServer();
    probeTimer = setInterval(probeServer, 2000);

    /*
     * ============================================================
     * Timer helper
     * ============================================================
     */

    function schedule(
        fn,
        delay
    ) {

        if (timerId !== null) {

            clearTimeout(
                timerId
            );
        }

        timerId =
            setTimeout(
                fn,
                delay
            );
    }


    /*
     * ============================================================
     * Shuffle
     * ============================================================
     */

    function shuffle() {

        order =
            images.slice();

        for (
            var i = order.length - 1;
            i > 0;
            i--
        ) {

            var j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );

            var temp =
                order[i];

            order[i] =
                order[j];

            order[j] =
                temp;
        }

        pos = 0;
    }


    /*
     * ============================================================
     * Image mode
     * ============================================================
     *
     * Restore the ordinary image layers and completely
     * remove the video element from layout/compositing.
     */

    function enterImageMode() {

        panVideo.style.display =
            "none";

        photo.style.display =
            "block";

        detailA.style.display =
            "block";

        detailB.style.display =
            "block";
    }


    /*
     * ============================================================
     * Video mode
     * ============================================================
     *
     * Old Android WebView handles video much more reliably
     * when the video is the only visible media layer.
     */

    function enterVideoMode() {

        photo.style.display =
            "none";

        detailA.style.display =
            "none";

        detailB.style.display =
            "none";

        panVideo.style.display =
            "block";
    }


    /*
     * ============================================================
     * Reset layers
     * ============================================================
     */

    function resetLayers() {

        if (timerId !== null) {

            clearTimeout(
                timerId
            );

            timerId = null;
        }


        enterImageMode();


        photo.style.transition =
            "none";

        detailA.style.transition =
            "none";

        detailB.style.transition =
            "none";


        photo.style.opacity =
            "0";

        detailA.style.opacity =
            "0";

        detailB.style.opacity =
            "0";


        detailA.style.left =
            "0px";

        detailB.style.left =
            "0px";


        detailA.style.top =
            "0px";

        detailB.style.top =
            "0px";


        /*
         * Stop any video left over from
         * the previous artwork.
         */

        try {

            panVideo.pause();

        } catch (e) {
        }


        panVideo.oncanplay =
            null;

        panVideo.onloadeddata =
            null;

        panVideo.onerror =
            null;

        panVideo.onended =
            null;


        panVideo.removeAttribute(
            "src"
        );


        try {

            panVideo.load();

        } catch (e) {
        }
    }


    /*
     * ============================================================
     * Convert pan JPG path to MP4 path
     * ============================================================
     *
     * display/pan_0017.jpg
     *
     * becomes
     *
     * display/pan_0017.mp4
     */

    function getPanVideoPath(
        panPath
    ) {

        if (!panPath) {

            return null;
        }


        return panPath.replace(
            /\.[^.\/]+$/,
            ".mp4"
        );
    }


    /*
     * ============================================================
     * Next artwork
     * ============================================================
     */

    function next() {

        if (
            typeof images === "undefined" ||
            !images ||
            images.length === 0
        ) {

            return;
        }


        if (
            pos >= order.length
        ) {

            shuffle();
        }


        var item =
            order[pos];

        pos++;


        if (connectionLost) return;

        resetLayers();

        if (window.EO1 && typeof window.EO1.showArtworkInfo === "function") {
            try { window.EO1.showArtworkInfo(JSON.stringify(item)); }
            catch (e) { console.log("Artwork info bridge error", e); }
        }

        var cacheBust =
            "?v=" +
            new Date().getTime();


        /*
         * Do not show the new image until it has
         * actually finished loading.
         */

        photo.onerror = function () {
            photo.onerror = null;
            probeServer();
        };

        photo.onload =
            function () {

                photo.onload =
                    null;


                photo.style.transition =
                    "none";

                photo.style.opacity =
                    "0";


                photo.offsetWidth;


                photo.style.opacity =
                    "1";


                if (item.pan) {

                    playWideArtwork(
                        item
                    );

                } else {

                    schedule(
                        function () {

                            fadeNormalToNext();

                        },
                        NORMAL_HOLD
                    );
                }
            };


        /*
         * Preload JPG detail images.
         *
         * They remain available as fallback
         * if MP4 loading/playback fails.
         */

        if (item.pan) {

            detailA.src =
                item.pan +
                cacheBust;

            detailB.src =
                item.pan +
                cacheBust;

        } else {

            detailA.removeAttribute(
                "src"
            );

            detailB.removeAttribute(
                "src"
            );
        }


        photo.src =
            item.display +
            cacheBust;
    }


    /*
     * ============================================================
     * Normal artwork -> next
     * ============================================================
     */

    function fadeNormalToNext() {
        if (connectionLost) return;

        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        photo.style.opacity =
            "0";


        schedule(
            next,
            DISSOLVE_TIME
        );
    }


    /*
     * ============================================================
     * Wide artwork
     * ============================================================
     *
     * Full
     *
     * then:
     *
     *     MP4 available
     *
     *         Full
     *           ->
     *         MP4
     *           ->
     *         Full
     *           ->
     *         Next
     *
     * The transitions into and out of MP4 are deliberately
     * hard cuts on old Android WebView.
     *
     * No image/video compositing is attempted.
     *
     *
     *     MP4 unavailable
     *
     *         Full
     *           ->
     *         Left
     *           ->
     *         Center
     *           ->
     *         Right
     *           ->
     *         Full
     *           ->
     *         Next
     */

    function playWideArtwork(
        item
    ) {

        schedule(
            function () {

                tryPanVideo(
                    item
                );

            },
            FULL_HOLD
        );
    }


    /*
     * ============================================================
     * Try MP4
     * ============================================================
     */

    function tryPanVideo(
        item
    ) {

        var videoPath =
            getPanVideoPath(
                item.pan
            );


        if (!videoPath) {

            startDetailSequence();

            return;
        }


        /*
         * EO1 Android app:
         *
         * Do not load the MP4 into the embedded HTML5 <video>.
         * Android 4.4 WebView can reach the MP4, but embedded
         * video rendering is unreliable on EO1.
         *
         * Instead, hand the relative MP4 path directly to the
         * native VideoView bridge in MainActivity.java.
         */
        if (
            window.EO1 &&
            typeof window.EO1.playNetworkVideo === "function"
        ) {

            try {

                console.log(
                    "EO1 native VideoView: " +
                    videoPath
                );

                window.EO1.playNetworkVideo(
                    videoPath
                );

                return;

            } catch (e) {

                console.log(
                    "EO1 native video bridge failed:",
                    e
                );

                startDetailSequence();

                return;
            }
        }


        /*
         * Desktop browser:
         *
         * Keep the existing HTML5 <video> path.
         */

        var settled =
            false;


        /*
         * MP4 successfully loaded.
         */

        function videoReady() {

            if (settled) {

                return;
            }

            settled = true;


            panVideo.oncanplay =
                null;

            panVideo.onloadeddata =
                null;

            panVideo.onerror =
                null;


            startPanVideo();
        }


        /*
         * MP4 unavailable.
         */

        function videoFailed() {

            if (settled) {

                return;
            }

            settled = true;


            panVideo.oncanplay =
                null;

            panVideo.onloadeddata =
                null;

            panVideo.onerror =
                null;


            try {

                panVideo.pause();

            } catch (e) {
            }


            panVideo.removeAttribute(
                "src"
            );


            enterImageMode();


            /*
             * Full artwork is still present.
             */

            photo.style.transition =
                "none";

            photo.style.opacity =
                "1";


            startDetailSequence();
        }


        panVideo.oncanplay =
            videoReady;

        panVideo.onloadeddata =
            videoReady;

        panVideo.onerror =
            videoFailed;


        /*
         * Do not cache-bust generated MP4 files.
         */

        panVideo.src =
            videoPath;


        try {

            panVideo.load();

        } catch (e) {

            videoFailed();
        }
    }


    /*
     * ============================================================
     * Start MP4
     * ============================================================
     *
     * Desktop browser path.
     *
     * EO1 does not normally enter this function because
     * tryPanVideo() sends the MP4 to native VideoView.
     *
     * There is deliberately NO opacity cross-fade here.
     */

    function startPanVideo() {

        try {

            panVideo.currentTime =
                0;

        } catch (e) {
        }


        /*
         * Remove all image layers from WebView composition.
         */

        enterVideoMode();


        /*
         * When video ends, restore the full artwork.
         */

        panVideo.onended =
            function () {

                panVideo.onended =
                    null;

                returnVideoToFull();
            };


        var playResult;


        try {

            playResult =
                panVideo.play();

        } catch (e) {

            fallbackFromVideo();

            return;
        }


        /*
         * Modern desktop browsers return a Promise.
         * Android 4.4 WebView may not.
         */

        if (
            playResult &&
            typeof playResult.catch === "function"
        ) {

            playResult.catch(
                function () {

                    fallbackFromVideo();
                }
            );
        }
    }


    /*
     * ============================================================
     * MP4 playback failure
     * ============================================================
     */

    function fallbackFromVideo() {

        try {

            panVideo.pause();

        } catch (e) {
        }


        panVideo.onended =
            null;


        /*
         * Completely remove video layer.
         */

        enterImageMode();


        /*
         * Restore full artwork.
         */

        photo.style.transition =
            "none";

        photo.style.opacity =
            "1";


        photo.offsetWidth;


        /*
         * Use static JPG detail sequence.
         */

        startDetailSequence();
    }


    /*
     * ============================================================
     * VIDEO -> FULL
     * ============================================================
     *
     * Desktop HTML5 video path.
     *
     * Hard switch intentionally.
     */

    function returnVideoToFull() {

        try {

            panVideo.pause();

        } catch (e) {
        }


        /*
         * Hide video first.
         */

        panVideo.style.display =
            "none";


        /*
         * Restore image layers.
         */

        photo.style.display =
            "block";

        detailA.style.display =
            "block";

        detailB.style.display =
            "block";


        photo.style.transition =
            "none";

        photo.style.opacity =
            "1";


        /*
         * Hold complete artwork briefly.
         */

        schedule(
            function () {

                finishWideArtwork();

            },
            FINAL_FULL_HOLD
        );
    }


    /*
     * ============================================================
     * JPG Detail sequence
     * ============================================================
     *
     * Used when MP4 is unavailable or native playback fails.
     *
     * Full
     *   ->
     * Left
     *   ->
     * Center
     *   ->
     * Right
     *   ->
     * Full
     *   ->
     * Next
     */

    function startDetailSequence() {

        enterImageMode();


        var viewportWidth =
            window.innerWidth;

        var viewportHeight =
            window.innerHeight;


        var imageWidth =
            detailA.offsetWidth;

        var imageHeight =
            detailA.offsetHeight;


        /*
         * Vertically center detail image.
         *
         * Small images are not enlarged.
         */

        var topPosition =
            Math.max(
                0,
                (viewportHeight - imageHeight) / 2
            );


        detailA.style.top =
            topPosition +
            "px";

        detailB.style.top =
            topPosition +
            "px";


        /*
         * Horizontal travel.
         */

        var distance =
            Math.max(
                0,
                imageWidth -
                viewportWidth
            );


        if (
            distance <= 0
        ) {

            schedule(
                finishWideArtwork,
                500
            );

            return;
        }


        var leftPosition =
            0;

        var centerPosition =
            -(distance / 2);

        var rightPosition =
            -distance;


        /*
         * ========================================================
         * FULL -> LEFT
         * ========================================================
         */

        detailA.style.transition =
            "none";

        detailA.style.left =
            leftPosition +
            "px";

        detailA.style.opacity =
            "0";


        detailA.offsetWidth;


        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        detailA.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";


        photo.style.opacity =
            "0";

        detailA.style.opacity =
            "1";


        schedule(
            function () {

                dissolveLeftToCenter();

            },
            DISSOLVE_TIME +
            DETAIL_HOLD
        );


        /*
         * ========================================================
         * LEFT -> CENTER
         * ========================================================
         */

        function dissolveLeftToCenter() {

            detailB.style.transition =
                "none";

            detailB.style.left =
                centerPosition +
                "px";

            detailB.style.opacity =
                "0";


            detailB.offsetWidth;


            detailA.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            detailB.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";


            detailA.style.opacity =
                "0";

            detailB.style.opacity =
                "1";


            schedule(
                function () {

                    dissolveCenterToRight();

                },
                DISSOLVE_TIME +
                DETAIL_HOLD
            );
        }


        /*
         * ========================================================
         * CENTER -> RIGHT
         * ========================================================
         */

        function dissolveCenterToRight() {

            detailA.style.transition =
                "none";

            detailA.style.left =
                rightPosition +
                "px";

            detailA.style.opacity =
                "0";


            detailA.offsetWidth;


            detailB.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            detailA.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";


            detailB.style.opacity =
                "0";

            detailA.style.opacity =
                "1";


            schedule(
                function () {

                    dissolveRightToFull();

                },
                DISSOLVE_TIME +
                DETAIL_HOLD
            );
        }


        /*
         * ========================================================
         * RIGHT -> FULL
         * ========================================================
         */

        function dissolveRightToFull() {

            photo.style.transition =
                "none";

            photo.style.opacity =
                "0";


            photo.offsetWidth;


            detailA.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            photo.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";


            detailA.style.opacity =
                "0";

            photo.style.opacity =
                "1";


            schedule(
                function () {

                    finishWideArtwork();

                },
                DISSOLVE_TIME +
                FINAL_FULL_HOLD
            );
        }
    }


    /*
     * ============================================================
     * FINAL FULL -> NEXT
     * ============================================================
     */

    function finishWideArtwork() {
        if (connectionLost) return;

        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        photo.style.opacity =
            "0";


        schedule(
            next,
            DISSOLVE_TIME
        );
    }


    /*
     * ============================================================
     * EO1 native VideoView callback
     * ============================================================
     *
     * MainActivity.java calls this after native MP4 playback.
     *
     * success = true
     *     Native MP4 completed normally.
     *     Restore the full artwork briefly, then continue.
     *
     * success = false
     *     Native MP4 failed.
     *     Fall back to the proven static detail sequence.
     */

    window.eo1NativeVideoFinished =
        function (success) {

            console.log(
                "EO1 native video finished: " +
                success
            );


            /*
             * Java has already hidden the native VideoView
             * and made this WebView visible again.
             */

            enterImageMode();


            photo.style.transition =
                "none";

            photo.style.opacity =
                "1";


            detailA.style.opacity =
                "0";

            detailB.style.opacity =
                "0";


            if (success) {

                /*
                 * MP4 completed normally:
                 *
                 * Full -> brief hold -> Next
                 */

                schedule(
                    function () {

                        finishWideArtwork();

                    },
                    FINAL_FULL_HOLD
                );

            } else {

                /*
                 * Native playback failed:
                 *
                 * Full -> Left -> Center -> Right
                 * -> Full -> Next
                 */

                startDetailSequence();
            }
        };


    /*
     * ============================================================
     * Start gallery
     * ============================================================
     */

    if (
        typeof images !== "undefined" &&
        images &&
        images.length > 0
    ) {

        shuffle();

        next();
    }

})();

</script>

</body>
</html>
