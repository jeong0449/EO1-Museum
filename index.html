<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>EO1 Museum</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/*
 * Full artwork layer.
 */
#photo {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    opacity: 0;
}

/*
 * Two detail layers.
 *
 * The same pan_####.jpg is loaded into both.
 * They alternate so that Left -> Center -> Right
 * can cross-dissolve directly.
 */
.detail {
    position: absolute;

    left: 0;
    top: 50%;

    width: auto;
    height: auto;

    max-width: none;
    max-height: 100%;

    transform: translateY(-50%);

    background: #000;

    opacity: 0;
}

</style>
</head>


<body>

<div id="stage">

    <img
        id="photo"
        alt=""
    >

    <img
        id="detailA"
        class="detail"
        alt=""
    >

    <img
        id="detailB"
        class="detail"
        alt=""
    >

</div>


<script src="images.js?v=6"></script>


<script>

(function () {

    /*
     * ============================================================
     * Timing
     * ============================================================
     */

    /*
     * Normal portrait / non-wide artwork.
     */
    var NORMAL_HOLD = 30000;


    /*
     * Wide artwork:
     *
     * Full artwork first.
     */
    var FULL_HOLD = 15000;


    /*
     * Cross-dissolve duration.
     */
    var DISSOLVE_TIME = 1500;


    /*
     * Hold time for each enlarged view:
     *
     * Left
     * Center
     * Right
     */
    var DETAIL_HOLD = 6000;


    /*
     * After Right, return to the complete artwork
     * and hold it briefly before the next artwork.
     */
    var FINAL_FULL_HOLD = 5000;


    /*
     * ============================================================
     * State
     * ============================================================
     */

    var order = [];

    var pos = 0;

    var timerId = null;


    var photo =
        document.getElementById(
            "photo"
        );

    var detailA =
        document.getElementById(
            "detailA"
        );

    var detailB =
        document.getElementById(
            "detailB"
        );


    /*
     * ============================================================
     * Timer helper
     * ============================================================
     */

    function schedule(
        fn,
        delay
    ) {

        if (timerId !== null) {

            clearTimeout(
                timerId
            );
        }

        timerId =
            setTimeout(
                fn,
                delay
            );
    }


    /*
     * ============================================================
     * Shuffle
     * ============================================================
     */

    function shuffle() {

        order =
            images.slice();

        for (
            var i = order.length - 1;
            i > 0;
            i--
        ) {

            var j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );

            var temp =
                order[i];

            order[i] =
                order[j];

            order[j] =
                temp;
        }

        pos = 0;
    }


    /*
     * ============================================================
     * Reset layers
     * ============================================================
     */

    function resetLayers() {

        photo.style.transition =
            "none";

        detailA.style.transition =
            "none";

        detailB.style.transition =
            "none";


        photo.style.opacity =
            "0";

        detailA.style.opacity =
            "0";

        detailB.style.opacity =
            "0";


        detailA.style.left =
            "0px";

        detailB.style.left =
            "0px";
    }


    /*
     * ============================================================
     * Next artwork
     * ============================================================
     */

    function next() {

        if (
            typeof images === "undefined" ||
            !images ||
            images.length === 0
        ) {

            return;
        }


        if (
            pos >= order.length
        ) {

            shuffle();
        }


        var item =
            order[pos];

        pos++;


        /*
         * Prepare all layers.
         *
         * Keep everything invisible while
         * the next full artwork is loading.
         */
        resetLayers();


        var cacheBust =
            "?v=" +
            new Date().getTime();


        /*
         * --------------------------------------------------------
         * IMPORTANT FOR OLD ANDROID WEBVIEW
         * --------------------------------------------------------
         *
         * Do not make the photo layer visible immediately
         * after changing photo.src.
         *
         * Old Android WebView may briefly repaint the
         * previous bitmap before the new image has finished
         * decoding.
         *
         * The new artwork becomes visible only after
         * its onload event fires.
         */

        photo.onload =
            function () {

                /*
                 * Remove this handler immediately.
                 */
                photo.onload =
                    null;


                /*
                 * Make sure the new bitmap has been
                 * committed while the layer is still
                 * invisible.
                 */
                photo.style.transition =
                    "none";

                photo.style.opacity =
                    "0";


                photo.offsetWidth;


                /*
                 * Now show the newly loaded artwork.
                 */
                photo.style.opacity =
                    "1";


                /*
                 * Wide artwork.
                 */
                if (item.pan) {

                    playWideArtwork();

                } else {

                    /*
                     * Normal artwork.
                     */
                    schedule(
                        function () {

                            fadeNormalToNext();

                        },
                        NORMAL_HOLD
                    );
                }
            };


        /*
         * Wide artwork:
         *
         * Preload the same detail image into
         * both detail layers while the full
         * artwork is loading / being displayed.
         */
        if (item.pan) {

            detailA.src =
                item.pan +
                cacheBust;

            detailB.src =
                item.pan +
                cacheBust;

        } else {

            detailA.removeAttribute(
                "src"
            );

            detailB.removeAttribute(
                "src"
            );
        }


        /*
         * Set the new full-artwork source LAST.
         *
         * The photo layer remains invisible until
         * photo.onload above confirms that the new
         * bitmap is ready.
         */
        photo.src =
            item.display +
            cacheBust;
    }


    /*
     * ============================================================
     * Normal artwork -> next artwork
     * ============================================================
     */

    function fadeNormalToNext() {

        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        photo.style.opacity =
            "0";


        schedule(
            next,
            DISSOLVE_TIME
        );
    }


    /*
     * ============================================================
     * Wide artwork sequence
     *
     * Full
     *   ->
     * Left
     *   ->
     * Center
     *   ->
     * Right
     *   ->
     * Full
     *   ->
     * Next
     * ============================================================
     */

    function playWideArtwork() {

        /*
         * Hold complete artwork first.
         */
        schedule(
            function () {

                startDetailSequence();

            },
            FULL_HOLD
        );
    }


    /*
     * ============================================================
     * Detail sequence
     * ============================================================
     */

    function startDetailSequence() {

        var viewportWidth =
            window.innerWidth;


        /*
         * Both detail layers contain
         * the same image and have the
         * same displayed width.
         */
        var imageWidth =
            detailA.offsetWidth;


        var distance =
            Math.max(
                0,
                imageWidth -
                viewportWidth
            );


        /*
         * Safety fallback.
         */
        if (
            distance <= 0
        ) {

            schedule(
                next,
                500
            );

            return;
        }


        /*
         * Left / Center / Right positions.
         */
        var leftPosition =
            0;

        var centerPosition =
            -(distance / 2);

        var rightPosition =
            -distance;


        /*
         * --------------------------------------------------------
         * FULL -> LEFT
         * --------------------------------------------------------
         */

        detailA.style.transition =
            "none";

        detailA.style.left =
            leftPosition +
            "px";

        detailA.style.opacity =
            "0";


        /*
         * Force layout before starting dissolve.
         */
        detailA.offsetWidth;


        photo.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";

        detailA.style.transition =
            "opacity " +
            DISSOLVE_TIME +
            "ms linear";


        photo.style.opacity =
            "0";

        detailA.style.opacity =
            "1";


        /*
         * Hold Left.
         */
        schedule(
            function () {

                dissolveLeftToCenter();

            },
            DISSOLVE_TIME +
            DETAIL_HOLD
        );


        /*
         * --------------------------------------------------------
         * LEFT -> CENTER
         * --------------------------------------------------------
         */

        function dissolveLeftToCenter() {

            /*
             * Prepare Center invisibly
             * on detailB.
             */
            detailB.style.transition =
                "none";

            detailB.style.left =
                centerPosition +
                "px";

            detailB.style.opacity =
                "0";


            detailB.offsetWidth;


            /*
             * Cross-dissolve:
             *
             * A = Left
             * B = Center
             */
            detailA.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            detailB.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";


            detailA.style.opacity =
                "0";

            detailB.style.opacity =
                "1";


            /*
             * Hold Center.
             */
            schedule(
                function () {

                    dissolveCenterToRight();

                },
                DISSOLVE_TIME +
                DETAIL_HOLD
            );
        }


        /*
         * --------------------------------------------------------
         * CENTER -> RIGHT
         * --------------------------------------------------------
         */

        function dissolveCenterToRight() {

            /*
             * detailA is now invisible.
             *
             * Reuse it for Right.
             */
            detailA.style.transition =
                "none";

            detailA.style.left =
                rightPosition +
                "px";

            detailA.style.opacity =
                "0";


            detailA.offsetWidth;


            /*
             * Cross-dissolve:
             *
             * B = Center
             * A = Right
             */
            detailB.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            detailA.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";


            detailB.style.opacity =
                "0";

            detailA.style.opacity =
                "1";


            /*
             * Hold Right.
             */
            schedule(
                function () {

                    dissolveRightToFull();

                },
                DISSOLVE_TIME +
                DETAIL_HOLD
            );
        }


        /*
         * --------------------------------------------------------
         * RIGHT -> FULL
         * --------------------------------------------------------
         */

        function dissolveRightToFull() {

            /*
             * Full artwork has remained loaded
             * in the photo layer.
             */
            photo.style.transition =
                "none";

            photo.style.opacity =
                "0";


            photo.offsetWidth;


            /*
             * Cross-dissolve:
             *
             * detailA = Right
             * photo   = Full
             */
            detailA.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            photo.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";


            detailA.style.opacity =
                "0";

            photo.style.opacity =
                "1";


            /*
             * Hold the complete artwork again.
             */
            schedule(
                function () {

                    finishWideArtwork();

                },
                DISSOLVE_TIME +
                FINAL_FULL_HOLD
            );
        }


        /*
         * --------------------------------------------------------
         * FINAL FULL -> NEXT
         * --------------------------------------------------------
         */

        function finishWideArtwork() {

            /*
             * Fade the complete artwork out
             * before loading the next artwork.
             */
            photo.style.transition =
                "opacity " +
                DISSOLVE_TIME +
                "ms linear";

            photo.style.opacity =
                "0";


            schedule(
                next,
                DISSOLVE_TIME
            );
        }
    }


    /*
     * ============================================================
     * Start gallery
     * ============================================================
     */

    if (
        typeof images !== "undefined" &&
        images &&
        images.length > 0
    ) {

        shuffle();

        next();
    }

})();

</script>

</body>
</html>
